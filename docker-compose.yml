services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: signal0-backend
    working_dir: /app/backend
    command: uvicorn api_server:app --host 0.0.0.0 --port 8888 --reload --reload-dir /app/backend
    ports:
      - "8888:8888"
    volumes:
      - ./backend:/app/backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: signal0-frontend
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
